<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="style.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SignUp Form</title>
</head>
<body>
  <div class="container">
    <div class="image-wrapper">
      <img src="odin_background.jpg" alt="green leaf plant in close up photography">
      <div class="logo">
        <img src="odin_logo.png" alt="A picture of the odin project logo">
        <h1>ODIN</h1>
      </div>
      <p class="author-attribute">
        Photo by <a href="https://unsplash.com/@haliewestphoto?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText">Halie West</a> on <a href="https://unsplash.com/photos/green-leaf-plant-in-close-up-photography-25xggax4bSA?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText">Unsplash</a>
      </p>
    </div>
    <div class="info-wrapper">
      <div class="intro">
        <p>This is not a real online service! You know you need something like this in your life 
          to help you realize your deepest dreams.Signup now to get started.
        </p>
        <p>You know you want to.</p>
      </div>

      <div class="form-wrapper">
        <h2>Lets do this!</h2>
        <form action="">
          <label for="firstname">First Name</label>
          <input type="text" name="first_name" id="firstname">
          <label for="lastname">Last Name</label>
          <input type="text" name="last_name" id="lastname">
          <label for="email">Email</label>
          <input type="email" required name="email" id="email">
          <label for="phonenumber">Phone Number</label>
          <input type="tel" name="phone_number" id="phonenumber">
          <label for="password">Password</label>
          <input type="password" name="password" id="password">
          <label for="confirm_pass">Confirm Password</label>
          <input type="password" name="pwd_confirm" id="confirm_pass">
        </form>
      </div>
      <div class="extras">
        <button type="submit">Create Account</button>
        <p>Already have an account? <a href="#">Log in</a></p>
      </div>
    </div>
  </div>
</body>
</html>
